AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Per-attendee Kiro Web scaffolding for the AWS Partner workshop, as a single
  self-contained deploy. Creates everything the workshop needs beyond the devbox: the
  IAM role a Kiro Web sandbox assumes, the SSM config bootstrap.sh reads, a Bedrock
  policy on the devbox instance role, and ECR create-on-push. One `aws cloudformation
  deploy`; its only output, KiroSandboxRoleArn, is the single value an attendee pastes
  into Kiro (Settings > Agent > Sandbox > IAM Role).

# ---------------------------------------------------------------------------------------
# Design note: ONE run, nothing imperative.
# ---------------------------------------------------------------------------------------
# Everything here is CloudFormation. There are no `aws ssm put-parameter`, `aws ecr`, or
# `aws ec2 modify-instance-metadata-options` side-steps — those would not be reproducible
# across 40 accounts. Two consequences worth knowing:
#
#   * Secrets (Cognito client secret, LlamaCloud key) are stored as SSM String, not
#     SecureString, because CloudFormation cannot create a SecureString without a custom
#     (Lambda-backed) resource. They are passed as NoEcho parameters and readable only by
#     principals with ssm:GetParameter on /workshop/* — i.e. the sandbox role below — in a
#     throwaway account that is deleted after the event. For a durable deployment, create
#     these two as SecureString out of band, or via a custom resource.
#   * IMDS is already handled: the marketplace devbox template sets
#     HttpPutResponseHopLimit=3, so task pods on the k3s-in-Docker box can reach the
#     instance role. Nothing to add here.

Parameters:
  FlyteDomain:
    Type: String
    Description: The devbox hostname, e.g. student01.flytedemo.app (devbox stack output FlyteCliEndpointProd).
  CognitoDomain:
    Type: String
    Description: Cognito hosted-UI base URL, e.g. https://<prefix>.auth.us-east-1.amazoncognito.com
  CognitoClientId:
    Type: String
    Description: The M2M client id (devbox stack output CognitoM2MClientId).
  CognitoClientSecret:
    Type: String
    NoEcho: true
    Description: The M2M client secret (from `aws cognito-idp describe-user-pool-client`).
  LlamaCloudApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: This attendee's LlamaCloud API key (llx-...). Used in Module 10. Optional; add later via a stack update if blank now.
  DevboxInstanceRoleName:
    Type: String
    Description: >
      Name of the EC2 instance role the devbox runs as (e.g.
      flyte-devbox-workshop-Compute-XXXX-InstanceRole-YYYY). Bedrock permissions are
      attached to it so task pods can call Claude via the instance role. Leave blank to
      skip (e.g. if the devbox role already grants Bedrock).
    Default: ""
  CognitoUserPoolId:
    Type: String
    Description: >
      The devbox's Cognito user pool id (devbox stack output CognitoUserPoolId). A login
      user is created in it so the attendee can sign in to the Flyte UI in a browser.
  AttendeeEmail:
    Type: String
    Description: Email that is the attendee's Flyte UI login (the pool uses email as username).
  ParameterPrefix:
    Type: String
    Default: /workshop
    Description: SSM path prefix. Must match SSM_PREFIX in scripts/bootstrap.sh.
  KiroTier:
    Type: String
    Default: pro
    AllowedValues: [pro, "pro+", power]
    Description: Kiro subscription tier assigned to the attendee's Identity Center user.
  KiroNonce:
    Type: String
    Default: ""
    Description: >
      Changes each deploy (deploy.sh passes a timestamp) so the EnableKiro custom resource
      re-runs every time -- Kiro enable is idempotent + best-effort, so retrying on each
      deploy is what we want (e.g. after a one-time console "enable Kiro").

Conditions:
  HasLlamaKey: !Not [!Equals [!Ref LlamaCloudApiKey, ""]]
  HasDevboxRole: !Not [!Equals [!Ref DevboxInstanceRoleName, ""]]

Resources:
  # -------------------------------------------------------------------------------------
  # SSM config — read at runtime by bootstrap.sh via the sandbox role. Nothing typed.
  # -------------------------------------------------------------------------------------
  FlyteDomainParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "${ParameterPrefix}/flyte-domain"
      Type: String
      Value: !Ref FlyteDomain

  CognitoDomainParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "${ParameterPrefix}/cognito-domain"
      Type: String
      Value: !Ref CognitoDomain

  CognitoClientIdParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "${ParameterPrefix}/cognito-client-id"
      Type: String
      Value: !Ref CognitoClientId

  CognitoClientSecretParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "${ParameterPrefix}/cognito-client-secret"
      Type: String
      Value: !Ref CognitoClientSecret

  LlamaCloudApiKeyParam:
    Type: AWS::SSM::Parameter
    Condition: HasLlamaKey
    Properties:
      Name: !Sub "${ParameterPrefix}/llama-cloud-api-key"
      Type: String
      Value: !Ref LlamaCloudApiKey

  # -------------------------------------------------------------------------------------
  # ECR create-on-push — so a build with any (root-level) image name auto-creates its
  # repository on first push. Prefix ROOT covers repos with no namespace, e.g. `flyte`.
  # -------------------------------------------------------------------------------------
  EcrCreateOnPush:
    Type: AWS::ECR::RepositoryCreationTemplate
    Properties:
      Prefix: ROOT
      AppliedFor:
        - CREATE_ON_PUSH
      Description: Auto-create root-level repositories on first push (workshop image builds).
      ImageTagMutability: MUTABLE

  # -------------------------------------------------------------------------------------
  # The role the Kiro sandbox assumes. Assumable only by Kiro's service principal.
  # -------------------------------------------------------------------------------------
  KiroSandboxRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "kiro-workshop-${AWS::AccountId}"
      Description: Assumed by this attendee's Kiro Web sandbox. ECR push + workshop SSM read only.
      MaxSessionDuration: 43200  # 12h — spans the workshop day so creds don't expire mid-session.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Principal q.amazonaws.com verified against kiro.dev/docs/web/sandbox/
          # environment-configuration. Kiro's example also pins sts:SourceIdentity to a
          # specific Kiro user id, which we can't know before attendees log in, so we omit
          # that value-condition to keep the role pre-bakeable. Consequence: any Kiro user
          # who learned this ARN could assume it — into a throwaway account that only holds
          # this devbox and is deleted after the event.
          - Effect: Allow
            Principal:
              Service: q.amazonaws.com
            Action:
              - "sts:AssumeRole"
              - "sts:SetSourceIdentity"
          - Effect: Allow
            Principal:
              Service: q.amazonaws.com
            Action: "sts:TagSession"
            Condition:
              "ForAllValues:StringEquals":
                "aws:TagKeys":
                  - GroupIds
                  - KiroSessionId
      Policies:
        - PolicyName: workshop-sandbox
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadWorkshopParams
                Effect: Allow
                Action:
                  - "ssm:GetParameter"
                  - "ssm:GetParameters"
                  - "ssm:GetParametersByPath"
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/*"
              - Sid: EcrAuth
                Effect: Allow
                Action: "ecr:GetAuthorizationToken"
                Resource: "*"
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - "ecr:BatchCheckLayerAvailability"
                  - "ecr:InitiateLayerUpload"
                  - "ecr:UploadLayerPart"
                  - "ecr:CompleteLayerUpload"
                  - "ecr:PutImage"
                  - "ecr:CreateRepository"
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/*"
              - Sid: WhoAmI
                Effect: Allow
                Action: "sts:GetCallerIdentity"
                Resource: "*"

  # -------------------------------------------------------------------------------------
  # Flyte UI login. The devbox's Cognito pool starts empty; the attendee needs a user to
  # sign in to the Flyte UI (the ALB gates it with Cognito). CloudFormation can create the
  # user but has NO password property — so a tiny Lambda-backed custom resource sets a
  # permanent, known password (the one on the handout). This is still one CFN deploy and
  # runs identically per account; it is not an out-of-band admin command.
  #
  # Trade-off: the password appears as a custom-resource property (visible in the stack /
  # CloudTrail). Fine for a throwaway account; for a durable one, deliver a temp password
  # by email (DesiredDeliveryMediums) and let the user reset it on first login instead.
  # -------------------------------------------------------------------------------------
  # Secrets Manager generates a policy-compliant password once, stable across redeploys.
  # The Lambda reads it and sets it on the user; the stack outputs it (below). This is how
  # the password ends up in the stack Outputs — an input parameter would go in, not out.
  FlytePasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Generated Flyte UI password for the attendee login.
      GenerateSecretString:
        PasswordLength: 16
        RequireEachIncludedType: true   # >=1 lower, upper, digit, symbol — meets the Cognito policy
        ExcludeCharacters: '"''\@/`$'   # drop chars that complicate CLI/JSON/handout

  FlyteUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref CognitoUserPoolId
      Username: !Ref AttendeeEmail
      MessageAction: SUPPRESS  # don't email an invite; the Lambda sets the password below
      UserAttributes:
        - Name: email
          Value: !Ref AttendeeEmail
        - Name: email_verified
          Value: "true"

  PasswordFnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: set-cognito-password
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action: cognito-idp:AdminSetUserPassword
                Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref FlytePasswordSecret

  PasswordFn:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt PasswordFnRole.Arn
      # Posts its own response with urllib rather than importing cfnresponse — that
      # module is NOT reliably present in the python3.12 inline runtime, and a missing
      # import means the function never replies and the stack hangs.
      Code:
        ZipFile: |
          import json, urllib.request, boto3
          def send(event, context, status, data=None, reason=None):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or "see CloudWatch",
                  "PhysicalResourceId": event.get("PhysicalResourceId") or context.log_stream_name,
                  "StackId": event["StackId"], "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"], "Data": data or {},
              }).encode()
              req = urllib.request.Request(event["ResponseURL"], data=body, method="PUT",
                                          headers={"content-type": "", "content-length": str(len(body))})
              urllib.request.urlopen(req)
          def handler(event, context):
              try:
                  data = {}
                  if event["RequestType"] in ("Create", "Update"):
                      p = event["ResourceProperties"]
                      pw = boto3.client("secretsmanager").get_secret_value(
                          SecretId=p["SecretArn"])["SecretString"]
                      boto3.client("cognito-idp").admin_set_user_password(
                          UserPoolId=p["UserPoolId"], Username=p["Username"],
                          Password=pw, Permanent=True)
                      data["Password"] = pw
                  send(event, context, "SUCCESS", data)
              except Exception as e:
                  send(event, context, "FAILED", reason=str(e))

  SetFlytePassword:
    Type: Custom::CognitoPassword
    DependsOn: FlyteUser
    Properties:
      ServiceToken: !GetAtt PasswordFn.Arn
      UserPoolId: !Ref CognitoUserPoolId
      Username: !Ref AttendeeEmail
      SecretArn: !Ref FlytePasswordSecret

  # -------------------------------------------------------------------------------------
  # Kiro Web access, fully in-stack. A custom resource runs the whole "enable Kiro"
  # sequence -- the same steps the console does, but via API, so no manual UI step:
  #   1. sso-admin:CreateInstance         -> IAM Identity Center account instance
  #   2. AWSCodeWhispererService.CreateProfile  -> the Kiro control-plane PROFILE (private
  #      "Consolas" admin API; without it CreateAssignment => kiro.controlplane NotFound)
  #   3. iam:CreateServiceLinkedRole      -> AWSServiceRoleForUserSubscriptions
  #   4. identitystore:CreateUser         -> the attendee's Identity Center user
  #   5. AmazonQDeveloperService.CreateAssignment -> the Kiro subscription (Pro/Pro+/Power)
  # Steps 2 and 5 are private, undocumented APIs (SigV4 signing name "q", codewhisperer
  # endpoint), reverse-engineered from aws/amazon-q-developer-cli. Unsupported; may change.
  KiroEnableFnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: kiro-enable
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: "*"
              # Identity Center instance + users, the SLR, and the private Q Developer /
              # CodeWhisperer admin API (exact IAM action names for the private ops aren't
              # documented, so the q/codewhisperer prefixes are granted broadly). Throwaway
              # per-attendee account.
              - Effect: Allow
                Action:
                  - "sso:*"
                  - "sso-directory:*"
                  - "identitystore:*"
                  - "q:*"
                  - "codewhisperer:*"
                  - "user-subscriptions:*"
                Resource: "*"
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"

  KiroEnableFn:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300                       # instance activation can take ~2 min
      Role: !GetAtt KiroEnableFnRole.Arn
      Code:
        ZipFile: |
          import json, os, time, uuid, urllib.request, urllib.error
          import boto3, botocore.auth, botocore.awsrequest

          TIERS = {"pro":"Q_DEVELOPER_STANDALONE_PRO",
                   "pro+":"Q_DEVELOPER_STANDALONE_PRO_PLUS",
                   "power":"Q_DEVELOPER_STANDALONE_POWER"}
          DBG = []
          def log(m):
              print(m); DBG.append(m)

          def send(event, context, status, data=None, reason=None):
              body = json.dumps({
                  "Status": status, "Reason": (reason or "see CloudWatch")[:1000],
                  "PhysicalResourceId": event.get("PhysicalResourceId") or context.log_stream_name,
                  "StackId": event["StackId"], "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"], "Data": data or {},
              }).encode()
              req = urllib.request.Request(event["ResponseURL"], data=body, method="PUT",
                  headers={"content-type": "", "content-length": str(len(body))})
              urllib.request.urlopen(req)

          def q_api(region, target, body, sign="q"):
              # SigV4-signed POST to the private Q Developer / CodeWhisperer admin endpoint. The
              # signing service DIFFERS by op: AmazonQDeveloperService.* => 'q';
              # AWSCodeWhispererService.* (profiles) => 'codewhisperer'.
              c = boto3.Session().get_credentials().get_frozen_credentials()
              url = "https://codewhisperer.%s.amazonaws.com/" % region
              payload = json.dumps(body)
              h = {"Content-Type": "application/x-amz-json-1.0", "X-Amz-Target": target}
              r = botocore.awsrequest.AWSRequest(method="POST", url=url, data=payload, headers=h)
              botocore.auth.SigV4Auth(c, sign, region).add_auth(r)
              req = urllib.request.Request(url, data=payload.encode(), headers=dict(r.headers), method="POST")
              try:
                  out = urllib.request.urlopen(req, timeout=30).read().decode()
                  log("%s [%s] OK: %s" % (target, sign, out[:160]))
                  return True, out
              except urllib.error.HTTPError as e:
                  out = e.read().decode()
                  log("%s [%s] ERR %d: %s" % (target, sign, e.code, out[:300]))
                  return False, "HTTP %d: %s" % (e.code, out)

          def ensure_instance(region):
              # An sso-admin:CreateInstance account instance IS accepted by Kiro as long as
              # CreateProfile's identitySource uses ssoRegion (not identityStoreId). Deleting an
              # instance kicks off async SLR cleanup that briefly blocks CreateInstance -> retry.
              sso = boto3.client("sso-admin", region_name=region)
              def ready():
                  for i in sso.list_instances().get("Instances", []):
                      if i.get("IdentityStoreId"):
                          return i
                  return None
              inst = ready()
              if not inst:
                  log("CreateInstance (sso-admin)...")
                  for _ in range(20):
                      try:
                          sso.create_instance(Name="kiro-workshop"); break
                      except Exception as e:
                          if "Service-linked role" in str(e) or "Conflict" in str(e):
                              time.sleep(15); continue
                          raise
                  for _ in range(60):
                      inst = ready()
                      if inst:
                          break
                      time.sleep(2)
              if not inst:
                  raise RuntimeError("no usable Identity Center instance")
              log("instance %s / store %s" % (inst["InstanceArn"], inst["IdentityStoreId"]))
              return inst

          def ensure_profile(region, iarn):
              arn = None
              ok, resp = q_api(region, "AWSCodeWhispererService.ListProfiles", {}, "codewhisperer")
              if ok:
                  try:
                      ps = json.loads(resp).get("profiles", [])
                      if ps:
                          arn = ps[0].get("arn") or ps[0].get("profileArn")
                          log("profile exists: %s" % arn)
                  except Exception:
                      pass
              if not arn:
                  ok, resp = q_api(region, "AWSCodeWhispererService.CreateProfile", {
                      "profileName": "kiro-workshop",
                      "referenceTrackerConfiguration": {"recommendationsWithReferences": "ALLOW"},
                      "activeFunctionalities": ["ANALYSIS", "CONVERSATIONS", "TASK_ASSIST", "TRANSFORMATIONS", "COMPLETIONS"],
                      # ssoRegion, NOT identityStoreId -- the wrong field caused "Invalid identity
                      # center configuration". Confirmed from the console's own CreateProfile call.
                      "identitySource": {"ssoIdentitySource": {"instanceArn": iarn, "ssoRegion": region}},
                      "clientToken": str(uuid.uuid4()),
                  }, "codewhisperer")
                  if not ok and "already" not in resp.lower():
                      raise RuntimeError("CreateProfile: " + resp)
                  try:
                      arn = json.loads(resp).get("arn") or json.loads(resp).get("profileArn")
                  except Exception:
                      arn = None
              # Enable Kiro Web (autonomous agents). CreateProfile does NOT set it -- the console
              # follows up with UpdateProfile optInFeatures.autonomousAgents.toggle=ON (from HAR).
              if arn:
                  ok, resp = q_api(region, "AWSCodeWhispererService.UpdateProfile", {
                      "profileArn": arn,
                      "profileName": "kiro-workshop",
                      "identitySource": {"ssoIdentitySource": {"instanceArn": iarn, "ssoRegion": region}},
                      "optInFeatures": {"overageConfiguration": {"overageStatus": "DISABLED"},
                                        "autonomousAgents": {"toggle": "ON"}},
                      "optInFeaturesType": "KIRO",
                      "referenceTrackerConfiguration": {"recommendationsWithReferences": "ALLOW"},
                      "activeFunctionalities": ["ANALYSIS", "CONVERSATIONS", "TASK_ASSIST", "TRANSFORMATIONS", "COMPLETIONS"],
                  }, "codewhisperer")
                  log("autonomous agents ON" if ok else "autonomousAgents FAILED: " + resp[:140])
              return arn

          def ensure_user(region, sid, email):
              ids = boto3.client("identitystore", region_name=region)
              f = ids.list_users(IdentityStoreId=sid,
                  Filters=[{"AttributePath": "UserName", "AttributeValue": email}]).get("Users", [])
              if f:
                  log("user exists: %s" % email)
                  return f[0]["UserId"]
              uid = ids.create_user(IdentityStoreId=sid, UserName=email, DisplayName=email,
                  Name={"GivenName": "Workshop", "FamilyName": "Attendee"},
                  Emails=[{"Value": email, "Type": "work", "Primary": True}])["UserId"]
              log("created user: %s" % email)
              return uid

          def assign(region, uid, sub, parn):
              # Right after profile creation the account is briefly "not authorized" -> retry.
              body = {"principalId": uid, "principalType": "USER", "subscriptionType": sub}
              if parn:
                  body["profileArn"] = parn
              for attempt in range(6):
                  ok, resp = q_api(region, "AmazonQDeveloperService.CreateAssignment", body, "q")
                  low = resp.lower()
                  if ok or "already" in low or "conflict" in low or "invalid state" in low:
                      return          # 200, or already-subscribed (idempotent)
                  if "not author" in low and attempt < 5:
                      time.sleep(10); continue
                  raise RuntimeError("CreateAssignment: " + resp)

          def handler(event, context):
              # NEVER fail the stack on a Kiro error: the admin API is private/undocumented and
              # its account-state prerequisites (e.g. a console-side "enable Kiro") aren't fully
              # reproducible. Create what we can; report status + a debug trail in the outputs and
              # CloudWatch so failures are diagnosable without blocking the devbox. Re-run deploy.sh
              # to retry (e.g. after a one-time console enable).
              del DBG[:]
              data = {"KiroStatus": "skipped", "KiroError": "", "KiroInstanceArn": "",
                      "KiroProfileArn": "", "KiroUserId": "", "KiroDebug": ""}
              try:
                  if event["RequestType"] in ("Create", "Update"):
                      p = event["ResourceProperties"]
                      region = os.environ["AWS_REGION"]
                      email = p["Email"]
                      sub = TIERS.get(p.get("Tier", "pro"), "Q_DEVELOPER_STANDALONE_PRO")
                      try:
                          boto3.client("iam").create_service_linked_role(
                              AWSServiceName="user-subscriptions.amazonaws.com")
                      except Exception as e:
                          log("SLR: %s" % str(e)[:120])
                      inst = ensure_instance(region)
                      data["KiroInstanceArn"] = inst["InstanceArn"]
                      parn = ensure_profile(region, inst["InstanceArn"])
                      data["KiroProfileArn"] = parn or ""
                      uid = ensure_user(region, inst["IdentityStoreId"], email)
                      data["KiroUserId"] = uid
                      assign(region, uid, sub, parn)
                      data["KiroStatus"] = "ok"
              except Exception as e:
                  data["KiroStatus"] = "failed"
                  data["KiroError"] = str(e)[:400]
                  log("FAILED: %s" % str(e)[:400])
              data["KiroDebug"] = " | ".join(DBG)[:900]
              send(event, context, "SUCCESS", data)   # SUCCESS even on Kiro failure (non-fatal)

  EnableKiro:
    Type: Custom::KiroEnable
    Properties:
      ServiceToken: !GetAtt KiroEnableFn.Arn
      Email: !Ref AttendeeEmail
      Tier: !Ref KiroTier
      Nonce: !Ref KiroNonce    # forces re-run every deploy (idempotent, best-effort)

  # -------------------------------------------------------------------------------------
  # Bedrock for the devbox task pods. Attached to the devbox's own instance role, so LLM
  # calls resolve credentials from the instance role via IMDS — no keys anywhere.
  # Superset covering both the classic Bedrock runtime and the Mantle endpoint.
  # -------------------------------------------------------------------------------------
  BedrockInstancePolicy:
    Type: AWS::IAM::Policy
    Condition: HasDevboxRole
    Properties:
      PolicyName: workshop-bedrock
      Roles:
        - !Ref DevboxInstanceRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: BedrockInvoke
            Effect: Allow
            # The Converse / ConverseStream APIs authorize under InvokeModel — there is no
            # separate bedrock:Converse action. bedrock-mantle:CreateInference covers the
            # AnthropicBedrockMantle endpoint the modules use.
            Action:
              - "bedrock:InvokeModel"
              - "bedrock:InvokeModelWithResponseStream"
              - "bedrock-mantle:CreateInference"
            Resource: "*"
          - Sid: BedrockMarketplaceSubscribe
            Effect: Allow
            Action:
              - "aws-marketplace:Subscribe"
              - "aws-marketplace:Unsubscribe"
              - "aws-marketplace:ViewSubscriptions"
            Resource: "*"

Outputs:
  KiroSandboxRoleArn:
    Description: >
      Paste this into Kiro Web at Settings > Agent > Sandbox > IAM Role. It is the ONLY
      value an attendee enters; everything else is fetched from SSM using it.
    Value: !GetAtt KiroSandboxRole.Arn
  ParameterPrefix:
    Description: SSM prefix bootstrap.sh reads. Must match SSM_PREFIX in scripts/bootstrap.sh.
    Value: !Ref ParameterPrefix
  FlyteUiUrl:
    Description: Open this in a browser to reach the Flyte UI (log in with the Cognito user below).
    Value: !Sub "https://${FlyteDomain}/v2"
  FlyteLoginEmail:
    Description: Username for the Flyte UI.
    Value: !Ref AttendeeEmail
  KiroStatus:
    Description: ok | failed | skipped -- outcome of the automated Kiro enable.
    Value: !GetAtt EnableKiro.KiroStatus
  KiroError:
    Description: Error message if KiroStatus is failed (empty otherwise).
    Value: !GetAtt EnableKiro.KiroError
  KiroDebug:
    Description: Step-by-step trace of the Kiro enable (also in the EnableKiro Lambda's CloudWatch logs).
    Value: !GetAtt EnableKiro.KiroDebug
  KiroInstanceArn:
    Description: IAM Identity Center instance used for Kiro.
    Value: !GetAtt EnableKiro.KiroInstanceArn
  KiroProfileArn:
    Description: The Kiro control-plane profile (if created).
    Value: !GetAtt EnableKiro.KiroProfileArn
  KiroUserId:
    Description: Identity Center user id (assign the Kiro subscription; sign in at app.kiro.dev).
    Value: !GetAtt EnableKiro.KiroUserId
  FlytePassword:
